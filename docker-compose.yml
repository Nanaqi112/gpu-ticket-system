services:
  # 应用服务：nginx（前端静态 + 反代） + Django(gunicorn)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gpu-tickets-app
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "80:80"
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - app-network

  # 数据库：Docker Hub 官方镜像
  db:
    image: postgres:15-alpine
    container_name: gpu-tickets-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gpu_tickets
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gpu_tickets"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  postgres_data:
    external: true
    name: gongdanxitong_postgres_data
  media_data:
    external: true
    name: gongdanxitong_media_data

networks:
  app-network:
    driver: bridge
